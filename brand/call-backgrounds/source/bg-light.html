<meta charset="utf-8">
<title>Dorian Insights — call background (light)</title>
<style>
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: #EDF0F8; }

  .stage {
    position: relative;
    width: 1920px; height: 1080px;
    overflow: hidden;
    font-family: 'IBM Plex Sans', sans-serif;
    background:
      radial-gradient(760px 620px at 90% 4%,  rgba(245,166,35,0.11), transparent 66%),
      radial-gradient(820px 600px at 8%  94%, rgba(27,20,100,0.10),  transparent 68%),
      linear-gradient(155deg, #FFFFFF 0%, #F4F6FB 44%, #E4E8F5 100%);
  }

  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle at 1px 1px, rgba(27,20,100,0.13) 1.15px, transparent 1.15px);
    background-size: 34px 34px;
    -webkit-mask-image: radial-gradient(1280px 840px at 50% 58%, rgba(0,0,0,0.04) 0%, rgba(0,0,0,0.42) 46%, #000 80%);
            mask-image: radial-gradient(1280px 840px at 50% 58%, rgba(0,0,0,0.04) 0%, rgba(0,0,0,0.42) 46%, #000 80%);
  }

  /* Inverse vignette: soft shading at the frame so a light shirt still separates */
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(1520px 1020px at 50% 55%,
      rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 42%, rgba(27,20,100,0.10) 100%);
  }

  .lockup { position: absolute; left: 120px; top: 96px; }
  .wordmark { display: flex; align-items: center; gap: 18px; }
  .mark { width: 20px; height: 20px; background: #F5A623; border-radius: 2px; }
  .wordmark .name {
    font-size: 46px; font-weight: 600; letter-spacing: -0.022em;
    color: #1B1464; line-height: 1;
  }
  .rule { width: 96px; height: 3px; background: #F5A623; margin: 22px 0 15px 38px; }
  .tagline {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px; font-weight: 400; letter-spacing: 0.185em; text-transform: uppercase;
    color: rgba(37,43,143,0.62); margin-left: 38px;
  }

  .bars {
    position: absolute; right: 122px; bottom: 152px;
    display: flex; align-items: flex-end; gap: 15px;
  }
  .bars i { display: block; width: 26px; border-radius: 2px; background: rgba(27,20,100,0.10); }
  .bars i.hi { background: rgba(245,166,35,0.55); }

  .url {
    position: absolute; right: 122px; bottom: 104px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px; letter-spacing: 0.06em;
    color: rgba(27,20,100,0.38);
  }
</style>

<div class="stage">
  <div class="dots"></div>
  <div class="vignette"></div>

  <div class="lockup">
    <div class="wordmark">
      <span class="mark"></span>
      <span class="name">Dorian Insights</span>
    </div>
    <div class="rule"></div>
    <div class="tagline">Data &middot; Analytics &middot; AI Strategy</div>
  </div>

  <div class="bars">
    <i style="height:44px"></i>
    <i style="height:76px"></i>
    <i style="height:58px"></i>
    <i style="height:100px"></i>
    <i style="height:84px"></i>
    <i class="hi" style="height:136px"></i>
  </div>
  <div class="url">dorianinsights.com</div>
</div>
